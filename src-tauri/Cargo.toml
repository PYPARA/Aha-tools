[package]
name = "ahatools"
version = "0.1.0"
description = "AhaTools: a lightweight macOS toolbox"
authors = ["JKY096"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ahatools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-dialog = "2.8.4"
libc = "0.2.191"
fuzzy-matcher = "0.3.7"
plist = "1.10.3"
ab_glyph = "0.2.32"
tauri-plugin-autostart = "2.7.0"
regex = "1.13.1"
tauri-plugin-clipboard-manager = "2.5.0"
pinyin = "0.11.0"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
png = "0.18"
imagequant = { version = "4.4.1", default-features = false }
oxipng = { version = "10.2.1", default-features = false }
mozjpeg = { version = "0.10.13", default-features = false, features = ["with_simd"] }
webp = { version = "0.3.1", default-features = false }
img-parts = "0.4.1"
rayon = "1.11"
sha2 = "0.10.9"
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "system-proxy"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
keyring = { version = "4.2", features = ["v1"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSPasteboard", "NSEvent", "NSScreen", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSString", "NSURL"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true
